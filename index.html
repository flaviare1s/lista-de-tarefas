<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="./js/index.js" defer></script>
  <title>✨ Lista de Tarefas</title>
</head>

<body>
  <div class="stars"></div>
  <div class="twinkling"></div>

  <main>
    <div class="header-container">
      <h1>
        <i class="fas fa-clipboard-list"></i>
        <span class="title-text">Lista de Tarefas</span>
      </h1>
      <p class="subtitle">Organize seu dia com estilo</p>
    </div>

    <form id="todo-form">
      <div class="input-wrapper">
        <i class="fas fa-pencil-alt input-icon"></i>
        <input id="new-task-input" type="text" placeholder="Adicionar tarefa">
      </div>
      <button type="submit" id="add-task-button">
        <i class="fas fa-plus"></i>
      </button>
    </form>

    <section>
      <ul id="todo-list">
      </ul>
    </section>
  </main>
</body>

</html>
